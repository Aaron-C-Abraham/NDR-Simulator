# NDR Test Environment Simulator Configuration

# Server settings
server.port=8090
server.name=netsim-ndr

# SQLite database
db.path=netsim-ndr.db

# NDR Agent target (where to send telemetry)
ndr.syslog.host=127.0.0.1
ndr.syslog.port=514
ndr.netflow.host=127.0.0.1
ndr.netflow.port=2055
ndr.ipfix.host=127.0.0.1
ndr.ipfix.port=4739
ndr.sflow.host=127.0.0.1
ndr.sflow.port=6343

# Telemetry output
output.pcap.dir=output/pcap
output.logs.dir=logs

# Real packet sender (Option A — actual packets on the wire for NDR capture)
# Set sender.real.enabled=true to make actual TCP/UDP connections during attacks.
# sender.c2.ip uses RFC 5737 TEST-NET (192.0.2.0/24) by default — never routed,
# so SYN packets go on the wire without actually reaching a real C2 server.
sender.real.enabled=false
sender.c2.ip=192.0.2.1
sender.c2.port=443

# Telemetry listeners (incoming from real devices)
listener.enabled=true
listener.syslog.port=10514
listener.netflow.port=12055
listener.ipfix.port=14739
listener.sflow.port=16343

# SNMP agent — exposes all topology devices via MIB-II for NMS discovery
# Use port 1161 if running without administrator privileges
snmp.port=161
snmp.community=public

# Simulation settings
sim.topology.file=scenarios/topology.yaml
sim.default.scenario=scenarios/b1_beaconing.yaml
sim.packet.rate=1000
sim.flow.interval=60
